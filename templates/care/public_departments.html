{% extends 'care/base.html' %}{% block content %}<div class="page-heading"><h1>Departments</h1><a class="secondary" href="{% url 'doctors' %}">Find a doctor</a></div><div class="doctor-grid">{% for dept in departments %}<article class="card"><h2>{{ dept.name }}</h2><p>{{ dept.description }}</p><a class="primary" href="{% url 'doctors' %}?department={{ dept.pk }}">View doctors</a></article>{% empty %}<section class="card"><p>No departments have been published yet.</p></section>{% endfor %}</div>{% endblock %}
