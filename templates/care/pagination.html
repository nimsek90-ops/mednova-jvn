{% load translate %}{% if pagination.has_other_pages %}<nav class="button-group" aria-label="Pagination">{% if pagination.has_previous %}<a class="secondary" href="?page={{ pagination.previous_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}">{{ 'Previous'|t:language }}</a>{% endif %}<span>Page {{ pagination.number }} / {{ pagination.paginator.num_pages }}</span>{% if pagination.has_next %}<a class="secondary" href="?page={{ pagination.next_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}">{{ 'Next'|t:language }}</a>{% endif %}</nav>{% endif %}
